server {
    listen 80 default_server;
    server_name target.com localhost 127.0.0.1;

    client_max_body_size 10m;

    # target.com/uploads/* -> MinIO public bucket.
    # This is the write-up's high-impact layout: uploads served from a path
    # behind the target's own reverse proxy, so files render on the site's
    # own origin. The query string (including response-content-type) is
    # forwarded to MinIO untouched.
    location /uploads/ {
        proxy_pass http://minio:9000/public/;
        proxy_set_header Host minio:9000;
    }

    # everything else -> the TargetSocial site
    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
    }
}
