services:
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: labadmin
      MINIO_ROOT_PASSWORD: labdev-only-change-me
    volumes:
      - minio-data:/data

  setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/app/init.sh"]
    volumes:
      - ./minio/init.sh:/app/init.sh:ro
      - ./payloads:/app/payloads:ro
    environment:
      MINIO_ROOT_USER: labadmin
      MINIO_ROOT_PASSWORD: labdev-only-change-me
      BUCKET: public

volumes:
  minio-data:
